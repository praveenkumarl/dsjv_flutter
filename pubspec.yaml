name: dsjv_app_2
description: DSJV App 2.0 - Astrology WebView app
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  device_info_plus: ^11.3.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  path_provider: ^2.1.0
  share_plus: ^10.1.0
  printing: ^5.13.4
  pdf: ^3.11.0
  android_id: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0B1B3A"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  color: "#0B1B3A"
  image: assets/logo.png
  android: true
  ios: false
